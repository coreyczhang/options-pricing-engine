name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cxx:
    name: Build, test & bench smoke (${{ matrix.os }})
    # Both platforms on purpose: Linux uses GCC/libstdc++, macOS uses
    # AppleClang/libc++. The docs claim a seed gives the same paths on both
    # (our own Box-Muller instead of std::normal_distribution); the
    # fixed-seed statistical tests passing on each is what backs that.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke test (Hull Greek-letters example)
        run: ./build/pricer call 49 50 0.3846 0.05 0.20

      - name: Validation tables run end to end
        run: ./build/ope_bench > bench.md && cat bench.md
